  <!-- HTTPS Enforcement & Security Checks -->
  <script>
    // Enforce HTTPS in production
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https://' + location.hostname + location.pathname + location.search + location.hash);
    }

    // Security: Check for console tampering (basic detection)
    (function() {
      const originalLog = console.log;
      const originalError = console.error;
      let suspiciousActivity = 0;
      
      console.log = function(...args) {
        if (args.some(arg => typeof arg === 'string' && arg.includes('password'))) {
          suspiciousActivity++;
          if (suspiciousActivity > 5) {
            console.warn('Suspicious activity detected');
          }
        }
        return originalLog.apply(console, args);
      };
      
      // Prevent basic iframe embedding (clickjacking protection)
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    })();
  </script>
